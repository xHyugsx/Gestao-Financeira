  <script>
    // Versão retirada: apaga a sua cache e o seu service worker{{DADOS_COMENTARIO}} e abre a app.
    (async () => {
      try {
        const aqui = new URL('./', location.href).href;
        for (const r of await navigator.serviceWorker.getRegistrations()) if (r.scope === aqui) await r.unregister();
      } catch { /* sem service worker */ }
      try { await caches.delete('{{CACHE}}'); } catch { /* sem cache */ }
      {{LIMPAR_DADOS}}
      location.replace('../');
    })();
  </script>
